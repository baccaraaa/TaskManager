<!DOCTYPE html>
<html>
<body style="font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto; padding: 20px;">
  <h2>Password Reset Request</h2>
  <p>Hi,</p>
  <p>We received a request to reset your password. Use the token below to complete the reset:</p>
  <p style="background: #f4f4f4; padding: 12px; font-family: monospace; border-radius: 4px;">{{ reset_token }}</p>
  <p>This token expires in 1 hour. If you didn't request this, you can safely ignore this email.</p>
  <p>Best regards,<br>Task Manager Team</p>
</body>
</html>
