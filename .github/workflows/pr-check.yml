name: Pull Request Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]

env:
  PYTHON_VERSION: 3.11

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.changes.outputs.python }}
      docker: ${{ steps.changes.outputs.docker }}
      docs: ${{ steps.changes.outputs.docs }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Check for changes
      uses: dorny/paths-filter@v2
      id: changes
      with:
        filters: |
          python:
            - 'app/**/*.py'
            - 'tests/**/*.py'
            - 'requirements.txt'
            - 'pyproject.toml'
          docker:
            - 'Dockerfile'
            - 'docker-compose.yml'
            - '.dockerignore'
          docs:
            - 'README.md'
            - 'docs/**'

  lint-and-format:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.python == 'true'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install black isort flake8 mypy

    - name: Check code formatting with Black
      run: |
        black --check --diff app/ tests/

    - name: Check import sorting with isort
      run: |
        isort --check-only --diff app/ tests/

    - name: Run flake8 linting
      run: |
        flake8 app/ tests/ --statistics

    - name: Run mypy type checking
      run: |
        mypy app/ --ignore-missing-imports

  test-pr:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.python == 'true'
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: taskmanager_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libpq-dev

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Set up environment variables
      run: |
        echo "DATABASE_URL=postgresql+asyncpg://postgres:password@localhost:5432/taskmanager_test" >> $GITHUB_ENV
        echo "DATABASE_URL_SYNC=postgresql://postgres:password@localhost:5432/taskmanager_test" >> $GITHUB_ENV
        echo "REDIS_URL=redis://localhost:6379/0" >> $GITHUB_ENV
        echo "SECRET_KEY=test-secret-key-for-pr" >> $GITHUB_ENV
        echo "ENVIRONMENT=testing" >> $GITHUB_ENV

    - name: Wait for services
      run: |
        until pg_isready -h localhost -p 5432; do
          echo "Waiting for PostgreSQL..."
          sleep 1
        done
        until redis-cli -h localhost -p 6379 ping; do
          echo "Waiting for Redis..."
          sleep 1
        done

    - name: Run tests
      run: |
        pytest --cov=app --cov-report=term-missing --tb=short

    - name: Comment PR with test results
      uses: actions/github-script@v6
      if: always()
      with:
        script: |
          const fs = require('fs');
          const { owner, repo } = context.repo;
          const { number: issue_number } = context.issue;
          
          // Create a comment with test results
          const comment = `## 🧪 Test Results
          
          The automated tests have completed for this pull request.
          
          **Status**: ${{ job.status }}
          **Python Version**: ${{ env.PYTHON_VERSION }}
          **Database**: PostgreSQL 15
          **Cache**: Redis 7
          
          Please check the [Actions tab](https://github.com/${owner}/${repo}/actions) for detailed results.`;
          
          github.rest.issues.createComment({
            owner,
            repo,
            issue_number,
            body: comment
          });

  docker-build-test:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image (test only)
      uses: docker/build-push-action@v5
      with:
        context: .
        push: false
        tags: taskmanager-api:pr-test
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Test Docker image
      run: |
        docker run --rm taskmanager-api:pr-test python -c "import app.main; print('✅ Application imports successfully')"

  pr-summary:
    runs-on: ubuntu-latest
    needs: [changes, lint-and-format, test-pr, docker-build-test]
    if: always()
    
    steps:
    - name: PR Summary Comment
      uses: actions/github-script@v6
      with:
        script: |
          const { owner, repo } = context.repo;
          const { number: issue_number } = context.issue;
          
          const needsResults = ${{ toJson(needs) }};
          
          let summary = "## 📋 Pull Request Summary\n\n";
          
          // Changes detected
          const changes = needsResults.changes.outputs;
          summary += "### Changes Detected:\n";
          summary += `- Python code: ${changes.python === 'true' ? '✅' : '❌'}\n`;
          summary += `- Docker files: ${changes.docker === 'true' ? '✅' : '❌'}\n`;
          summary += `- Documentation: ${changes.docs === 'true' ? '✅' : '❌'}\n\n`;
          
          // Job results
          summary += "### Check Results:\n";
          Object.entries(needsResults).forEach(([job, result]) => {
            if (job !== 'changes') {
              const status = result.result === 'success' ? '✅' : 
                           result.result === 'failure' ? '❌' : 
                           result.result === 'skipped' ? '⏭️' : '❓';
              summary += `- ${job.replace('-', ' ')}: ${status} ${result.result}\n`;
            }
          });
          
          summary += "\n---\n*This comment was automatically generated by GitHub Actions*";
          
          github.rest.issues.createComment({
            owner,
            repo,
            issue_number,
            body: summary
          });
