[tool:pytest]
minversion = 7.0
addopts = 
    -ra
    --strict-markers
    --strict-config
    --cov=app
    --cov-report=term-missing:skip-covered
    --cov-report=html
    --cov-report=xml
    --cov-fail-under=80
    -p no:warnings
testpaths = tests
asyncio_mode = auto
python_files = test_*.py
python_functions = test_*
python_classes = Test*
